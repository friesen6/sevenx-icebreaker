<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SevenX Icebreaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: quiet document-like screen. Host = question card + a narrow column (timer, QR). Phone = single column of four vote buttons. One teal accent on neutral greys. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #14181f; --soft: #5a6472; --faint: #8a93a1; --line: #dfe3e9;
  --accent: #0d6b66; --accent-ink: #ffffff; --accent-soft: #d9eeec; --bar: #e6e9ee; --warn: #b4322b;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #151a21; --ink: #e8ecf1; --soft: #9aa4b2; --faint: #6f7987; --line: #262d37;
    --accent: #52c4b8; --accent-ink: #08201d; --accent-soft: #173a38; --bar: #1e252f; --warn: #ff8f86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #151a21; --ink: #e8ecf1; --soft: #9aa4b2; --faint: #6f7987; --line: #262d37;
  --accent: #52c4b8; --accent-ink: #08201d; --accent-soft: #173a38; --bar: #1e252f; --warn: #ff8f86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 1.0625rem; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { min-height: 100vh; display: flex; flex-direction: column; gap: 20px; padding-inline: 24px; padding-block: 20px; max-width: 1400px; margin-inline: auto; }
.prog { position: fixed; inset: 0 0 auto 0; height: 2px; background: transparent; z-index: 5; }
.prog i { display: block; height: 100%; width: var(--p, 0%); background: var(--accent); transition: width .4s ease; }

.top { display: flex; align-items: center; gap: 20px; min-height: 36px; }
.wm { font-weight: 600; letter-spacing: -0.01em; font-size: 1.05rem; white-space: nowrap; }
.wm .x { color: var(--accent); margin-left: 1px; }
.crumb { color: var(--soft); font-size: 0.9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.meta { display: flex; align-items: center; gap: 8px; color: var(--soft); font-size: 0.85rem; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.dot.off { background: var(--warn); }
.icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--soft); }
.icon:hover { color: var(--ink); }
.icon svg { width: 16px; height: 16px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; flex: 1; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 32px; min-width: 0; }
.card.main { display: flex; flex-direction: column; gap: 24px; }
.side { display: flex; flex-direction: column; gap: 20px; }
.side .card { padding: 20px; }
.eyebrow { color: var(--soft); font-size: 0.85rem; letter-spacing: 0.02em; display: flex; gap: 10px; flex-wrap: wrap; }
.eyebrow b { color: var(--ink); font-weight: 500; }
h1, h2 { font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 3.6vw, 3.1rem); }
h2 { font-size: clamp(1.4rem, 2.4vw, 2.1rem); }
.lede { color: var(--soft); font-size: 1.15rem; max-width: 60ch; margin: 0; }
.scene { color: var(--soft); font-size: clamp(1.05rem, 1.5vw, 1.3rem); max-width: 64ch; margin: 0; padding-left: 16px; border-left: 2px solid var(--line); }
.label { color: var(--faint); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }

/* options on the big screen */
.rows { display: flex; flex-direction: column; gap: 10px; }
.row { position: relative; overflow: hidden; display: flex; align-items: center; gap: 16px; border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; min-width: 0; transition: border-color .2s, opacity .3s; }
.row .bar { position: absolute; inset: 0 auto 0 0; width: var(--pct, 0%); background: var(--bar); transition: width .5s ease, background .3s; }
.row > *:not(.bar) { position: relative; }
.key { flex: none; width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 500; font-size: 0.9rem; color: var(--soft); background: var(--surface); }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.m { font-weight: 500; font-size: clamp(1.05rem, 1.5vw, 1.3rem); overflow-wrap: anywhere; }
.s { color: var(--soft); font-size: 0.9rem; }
.num { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num b { font-weight: 500; font-size: 1.15rem; min-width: 3.4ch; text-align: right; }
.num i { font-style: normal; color: var(--faint); font-size: 0.85rem; min-width: 2.2ch; text-align: right; }
.row.lead { border-color: var(--accent); }
.row.lead .bar { background: var(--accent-soft); }
.row.lead .key { border-color: var(--accent); color: var(--accent); }
.row.right { border-color: var(--accent); border-width: 2px; padding: 13px 17px; }
.row.right .bar { background: var(--accent-soft); }
.row.right .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row.dim { opacity: .5; }
.tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--accent); }

.note { border-left: 2px solid var(--accent); padding-left: 16px; max-width: 70ch; display: flex; flex-direction: column; gap: 4px; }
.note p { margin: 0; font-size: 1.1rem; }

/* side column */
.clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 3.4rem; line-height: 1; letter-spacing: -0.02em; }
.clock.low { color: var(--warn); }
.clock.held { color: var(--soft); }
.tbar.held i { background: var(--faint); }
.phone .key { width: 30px; height: 30px; font-size: 0.9rem; }
.tbar { height: 4px; background: var(--bar); border-radius: 2px; overflow: hidden; margin-top: 14px; }
.tbar i { display: block; height: 100%; width: var(--p, 100%); background: var(--accent); }
.tbar.low i { background: var(--warn); }
.stat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; font-size: 0.9rem; color: var(--soft); }
.stat b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); font-size: 1rem; }
.big-n { font-family: var(--font-mono); font-weight: 500; font-size: 2.6rem; line-height: 1; letter-spacing: -0.02em; }
.qr { background: #fff; padding: 12px; border-radius: 8px; border: 1px solid var(--line); }
.qr svg { display: block; width: 100%; height: auto; }
button.qr { display: block; width: 100%; cursor: zoom-in; font: inherit; }
button.qr:hover { border-color: var(--faint); }
.zoom { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: var(--bg); padding: 24px; width: 100%; border: 0; cursor: zoom-out; font: inherit; color: var(--ink); }
.zoom .qr { width: min(78vmin, 820px); padding: 3vmin; cursor: zoom-out; }
.zoom .u { font-family: var(--font-mono); font-size: clamp(1rem, 2.4vmin, 1.6rem); color: var(--soft); text-align: center; overflow-wrap: anywhere; max-width: 90vw; }
.zoom .c { color: var(--faint); font-size: 0.9rem; }
.url { font-family: var(--font-mono); font-size: 0.8rem; color: var(--soft); overflow-wrap: anywhere; margin-top: 10px; }
.lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 48px; align-items: center; }
.lobby .qr { padding: 20px; }

/* results */
.res { display: flex; flex-direction: column; gap: 10px; }
.res-row { display: grid; grid-template-columns: 5.5ch minmax(0, 1fr) 11ch; gap: 16px; align-items: center; font-size: 0.95rem; }
.res-row .q { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-row .bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; grid-column: 2; grid-row: 1; }
.res-row .bar i { display: block; height: 100%; width: var(--pct); background: var(--accent); }
.vals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.val { border-top: 2px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.val b { font-weight: 600; }
.val span { color: var(--soft); font-size: 0.9rem; }
.closer { font-size: clamp(1.1rem, 1.8vw, 1.45rem); line-height: 1.35; max-width: 42ch; margin: 0; font-weight: 500; text-wrap: balance; }

/* controls */
.ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-bottom: env(safe-area-inset-bottom, 0px); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 16px; font-weight: 500; font-size: 0.95rem; }
.btn:hover:not(:disabled) { border-color: var(--faint); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--soft); }
.btn:disabled { opacity: .4; cursor: default; }
.hint { color: var(--faint); font-size: 0.85rem; }
.unlock { display: flex; gap: 8px; }
.unlock input { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; width: 14ch; }
.err { color: var(--warn); font-size: 0.85rem; }

/* phone */
.phone .app { max-width: 520px; padding-inline: 16px; gap: 14px; }
.phone .card { padding: 20px; }
.phone .card.main { gap: 18px; }
.phone h2 { font-size: 1.45rem; }
.pbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--soft); font-size: 0.85rem; }
.pbar .clock { font-size: 1.4rem; color: var(--ink); }
.pbar .clock.low { color: var(--warn); }
.pbtns { display: flex; flex-direction: column; gap: 10px; }
.pbtn { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 64px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); transition: border-color .15s, background .15s, opacity .2s; }
.pbtn:active:not(:disabled) { background: var(--bar); }
.pbtn:disabled { cursor: default; }
.pbtn .m { font-size: 1.05rem; }
.pbtn.picked { border-color: var(--accent); background: var(--accent-soft); }
.pbtn.picked .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pbtn.right { border: 2px solid var(--accent); background: var(--accent-soft); padding: 11px 15px; }
.pbtn.dim:not(.picked) { opacity: .5; }
.pbtn.wrong { border-color: var(--warn); }
.verdict { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 10px; background: var(--bar); }
.verdict b { font-weight: 600; font-size: 1.1rem; }
.verdict.ok b { color: var(--accent); }
.verdict.no b { color: var(--warn); }
.verdict span { color: var(--soft); font-size: 0.9rem; }
.foot { text-align: center; color: var(--faint); font-size: 0.8rem; }

/* Big-screen scale: the whole host UI grows with the display width (about 1.6x at 1920px, 2x at 4K). */
html.host { --u: min(1vw, 1.7vh); font-size: clamp(16px, calc(var(--u) * 0.9 + 8px), 40px); }
html.host .app { max-width: 2400px; padding-inline: 2rem; padding-block: 1rem; gap: 1rem; }
html.host .grid { grid-template-columns: minmax(0, 1fr) clamp(300px, calc(var(--u) * 22), 560px); gap: 1.5rem; }
html.host .card { padding: 1.6rem; }
html.host .side .card { padding: 1.4rem; }
html.host .side { gap: 1.5rem; }
html.host .card.main { gap: 1.2rem; }
html.host h1 { font-size: clamp(2.2rem, calc(var(--u) * 4), 5.5rem); }
html.host h2 { font-size: clamp(1.9rem, calc(var(--u) * 3.5), 4.8rem); line-height: 1.12; }
html.host .lede { font-size: clamp(1.15rem, calc(var(--u) * 1.7), 2.4rem); max-width: 64ch; }
html.host .scene { font-size: clamp(1.15rem, calc(var(--u) * 1.9), 2.7rem); max-width: 70ch; }
html.host .rows { gap: 0.6rem; }
html.host .row { padding: 0.6rem 1.1rem; gap: 1.1rem; }
html.host .row.right { padding: calc(0.6rem - 1px) calc(1.1rem - 1px); }
html.host .key { width: clamp(30px, calc(var(--u) * 2.3), 66px); height: clamp(30px, calc(var(--u) * 2.3), 66px); font-size: clamp(0.9rem, calc(var(--u) * 1.3), 1.9rem); border-radius: 8px; }
html.host .m { font-size: clamp(1.15rem, calc(var(--u) * 2.3), 3.1rem); line-height: 1.2; }
html.host .s { line-height: 1.3; font-size: clamp(0.9rem, calc(var(--u) * 1.25), 1.8rem); }
html.host .num b { font-size: clamp(1.15rem, calc(var(--u) * 2), 2.8rem); }
html.host .num i { font-size: clamp(0.85rem, calc(var(--u) * 1.2), 1.7rem); }
html.host .tag { font-size: clamp(0.75rem, calc(var(--u) * 1), 1.4rem); }
html.host .note p { font-size: clamp(1.1rem, calc(var(--u) * 1.7), 2.4rem); }
html.host .clock { font-size: clamp(3rem, calc(var(--u) * 5.2), 9rem); }
html.host .label { font-size: clamp(0.75rem, calc(var(--u) * 1), 1.4rem); }
html.host .stat { font-size: clamp(0.9rem, calc(var(--u) * 1.2), 1.7rem); }
html.host .stat b { font-size: clamp(1rem, calc(var(--u) * 1.5), 2.1rem); }
html.host .eyebrow { font-size: clamp(0.85rem, calc(var(--u) * 1.25), 1.8rem); }
html.host .crumb { font-size: clamp(0.9rem, calc(var(--u) * 1.25), 1.8rem); }
html.host .wm { font-size: clamp(1.05rem, calc(var(--u) * 1.5), 2.1rem); }
html.host .meta { font-size: clamp(0.85rem, calc(var(--u) * 1.15), 1.6rem); }
html.host .url { font-size: clamp(0.8rem, calc(var(--u) * 1.05), 1.5rem); }
html.host .btn { font-size: clamp(0.95rem, calc(var(--u) * 1.15), 1.6rem); padding: 0.55rem 1.1rem; }
html.host .hint { font-size: clamp(0.85rem, calc(var(--u) * 1), 1.4rem); }
html.host .res-row { font-size: clamp(0.95rem, calc(var(--u) * 1.35), 1.9rem); }
html.host .val span { font-size: clamp(0.9rem, calc(var(--u) * 1.2), 1.7rem); }
html.host .val b { font-size: clamp(1rem, calc(var(--u) * 1.5), 2.1rem); }
html.host .closer { font-size: clamp(1.2rem, calc(var(--u) * 2), 2.8rem); }
html.host .big-n { font-size: clamp(2.6rem, calc(var(--u) * 3.6), 6rem); }
html.host .lobby { grid-template-columns: minmax(0, 1fr) minmax(0, clamp(320px, calc(var(--u) * 34), 900px)); gap: 4rem; }
html.host .icon { width: clamp(34px, calc(var(--u) * 2.4), 64px); height: clamp(34px, calc(var(--u) * 2.4), 64px); }
html.host .icon svg { width: 55%; height: 55%; }
@media (max-width: 960px) {
  html.host .grid, html.host .lobby { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 960px) {
  .app { padding-inline: 16px; }
  .grid, .lobby { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .card { padding: 20px; }
  .vals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .crumb { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="prog" aria-hidden="true"><i id="prog"></i></div>

  /* ---------- theme ---------- */

  function themeBtn() {

    var sun = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>';

  /* ---------- helpers ---------- */

  function hostControls() {

  /* ---------- PHONE views ---------- */

    }).join('') + '</div>';

      } else h += '<div class="verdict" role="status"><b>' + (mine == null ? 'No vote' : 'You voted ' + LETTERS[mine]) + '</b><span>SevenX chose ' + LETTERS[st.correct] + '.</span></div>';

  /* ---------- render ---------- */
  function view() {
    var s = cur();
    var head = '<div class="top"><span class="wm">SevenX<span class="x">×</span></span><span class="crumb">' + (st ? esc(crumb(s)) : '') + '</span><span class="spacer"></span>' +
      '<span class="meta"><span class="dot' + (offline ? ' off' : '') + '"></span><span>' + (offline ? 'Reconnecting' : HOST && st ? '<span data-live="present">' + st.present + '</span> connected' : 'Connected') + '</span></span>' + themeBtn() + '</div>';

      var body = s.type === 'lobby' ? main : '<div class="grid">' + main + '</div>';
      return head + body + hostControls() + (qrOpen ? '<button class="zoom" data-zoom aria-label="Close enlarged QR code"><span class="qr">' + qrSvg(playUrl()) + '</span><span class="u">' + esc(playUrl()) + '</span><span class="c">Click anywhere or press Esc to close</span></button>' : '');
    }
    return head + phoneMain(s) + '<div class="foot">Anonymous · one vote per question</div>';
  }
  function sigOf() {
    if (!st) return 'none|' + offline;
    return [st.slide, st.revealed, st.paused, st.correct, st.mine, localVote[st.slide], HOST ? qrOpen + '|' + unlocked + '|' + unlockOpen + '|' + busy + '|' + resetArmed + '|' + authError : '', offline, st.tally && st.tally.ok, notice, effectiveTheme(), (st.room || []).length].join('|');
  }
  function render() {
    var app = document.getElementById('app');
    var a = document.activeElement, id = a && a.id, typed = (id === 'pass') ? a.value : null;
    app.innerHTML = view();
    document.body.className = HOST ? '' : 'phone';
    if (id) { var el = document.getElementById(id); if (el) { el.focus(); if (typed !== null) el.value = typed; } }
    var p = document.getElementById('prog');
    if (p && st) p.style.setProperty('--p', Math.round(100 * st.slide / (SLIDES.length - 1)) + '%');

  }
  /* Host only: if the content is taller than the screen, scale it down to fit (CSS zoom). */
  function fit() {
    if (!HOST) return;

    app.style.zoom = 1;

  }
  window.addEventListener('resize', function () { fit(); });
  /* update numbers in place so bars animate instead of re-mounting */

    document.querySelectorAll('[data-live="voted"]').forEach(function (e) { e.textContent = st.voted; });
    document.querySelectorAll('[data-live="denom"]').forEach(function (e) { e.textContent = Math.max(st.present, st.voted); });
    var vb = document.querySelector('[data-live="votebar"]'); if (vb) vb.style.setProperty('--p', Math.min(100, pctOf(st.voted, Math.max(st.present, st.voted))) + '%');

    var max = Math.max.apply(null, st.counts), leaders = st.counts.filter(function (c) { return c === max; }).length;
    document.querySelectorAll('.row[data-i]').forEach(function (r) {
      var i = +r.getAttribute('data-i'), c = st.counts[i];
      r.style.setProperty('--pct', pctOf(c, st.voted) + '%');
      r.querySelector('[data-p]').textContent = st.voted ? pctOf(c, st.voted) + '%' : '–';
      r.querySelector('[data-c]').textContent = c;
      r.classList.toggle('lead', !st.revealed && max > 0 && leaders === 1 && c === max);

  }
  function tick() {
    if (!st || cur().type !== 'q') return;

    var t = document.getElementById('timer');
    if (t && !rev) { t.textContent = fmt(rem); t.classList.toggle('low', rem <= 5 && !st.paused); }
    var b = document.getElementById('tbar');
    if (b) { b.firstElementChild.style.setProperty('--p', Math.max(0, 100 * rem / total()) + '%'); b.classList.toggle('low', rem <= 5 && !st.paused); }
    if (!HOST && !rev && rem <= 0) document.querySelectorAll('.pbtn').forEach(function (x) { x.disabled = true; });
    if (!rev && rem <= 0 && !st.paused) {
      var key = st.slide + '@' + st.deadline;

    }
  }
  setInterval(tick, 200);

  function poll() {
    var my = ++seq;

      if (st && st.slide === s.slide && st.opened_at !== s.opened_at) { delete localVote[s.slide]; notice = ''; }
      st = s;
      var sg = sigOf();
      if (sg !== structSig || was) { structSig = sg; render(); } else live();
    }).catch(function () {
      if (!offline) { offline = true; structSig = ''; render(); }
    });
  }
  setInterval(poll, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  if (!HOST) {
    var ping = function () { rpc('ib_ping', { p_device: device }).catch(function () {}); };
    ping(); setInterval(ping, 5000);
  }

  /* ---------- actions ---------- */
  function hostAct(fn) {
    if (busy) return; busy = true; structSig = ''; render();
    fn().catch(function () { offline = true; }).then(function () { busy = false; structSig = ''; return poll(); });
  }
  function hostNext() {
    if (!unlocked || !st || busy) return;
    var s = cur();
    if (s.type === 'q' && !st.revealed) return hostAct(function () { return rpc('ib_host_reveal', { p_pass: hostPass }); });
    if (st.slide < SLIDES.length - 1) { var to = st.slide + 1; hostAct(function () { return rpc('ib_host_set_slide', { p_pass: hostPass, p_slide: to }); }); }
  }
  function hostPause() {
    if (!unlocked || !st || busy || cur().type !== 'q' || st.revealed) return;
    var fn = st.paused ? 'ib_host_resume' : 'ib_host_pause';
    hostAct(function () { return rpc(fn, { p_pass: hostPass }); });
  }
  function hostBack() {

  }
  function castVote(slide, choice) {

  }

  var app = document.getElementById('app');
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-qr')) { qrOpen = true; structSig = ''; render(); }
    else if (b.hasAttribute('data-zoom')) { qrOpen = false; structSig = ''; render(); }
    else if (b.id === 'theme') {

      document.documentElement.setAttribute('data-theme', next); lsSet('sx-theme', next); structSig = ''; render();

    else if (b.id === 'next') hostNext();
    else if (b.id === 'back') hostBack();
    else if (b.id === 'pause') hostPause();
    else if (b.id === 'openUnlock') { unlockOpen = true; structSig = ''; render(); }
    else if (b.id === 'restart') hostAct(function () { return rpc('ib_host_restart', { p_pass: hostPass }); });

      if (resetArmed) { resetArmed = false; hostAct(function () { return rpc('ib_host_reset', { p_pass: hostPass }); }); }
      else { resetArmed = true; structSig = ''; render(); }
    }
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id !== 'unlock') return;
    var p = document.getElementById('pass').value.trim();
    rpc('ib_host_ok', { p_pass: p }).then(function (ok) {
      if (ok) { hostPass = p; lsSet('sx-hostpass', p); unlocked = true; unlockOpen = false; authError = ''; }
      else authError = 'That passcode is not right.';
    }).catch(function () { authError = 'Could not reach the server.'; }).then(function () { structSig = ''; render(); });
  });
  document.addEventListener('keydown', function (e) {
    if (HOST && qrOpen && (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); qrOpen = false; structSig = ''; render(); return; }

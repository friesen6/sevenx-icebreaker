<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SevenX Icebreaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: host view is a wide stage for the projector; player view is a narrow phone column. Seven-segment digits echo "Seven". */
:root {
  --bg: #eef2f5; --surface: #ffffff; --surface-2: #e4eaf0; --ink: #12213a; --ink-soft: #4b5c76; --line: #cdd7e2;
  --accent: #f0b400; --accent-ink: #12213a; --good: #1f8f55; --good-bg: #dcf2e6; --bad: #c0392b; --bad-bg: #f7dedb;
  --seg-off: #d6dee8; --bar: #c9d6e6;
  --c1: #2a86c8; --c2: #d9534f; --c3: #2c9a5e; --c4: #7a5bc7;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1626; --surface: #16233b; --surface-2: #1f2f4b; --ink: #eef3fa; --ink-soft: #9fb0c9; --line: #2c4064;
    --accent: #f5c230; --accent-ink: #12213a; --good: #4cc983; --good-bg: #17402e; --bad: #f07a76; --bad-bg: #4a2220;
    --seg-off: #26385a; --bar: #2f4a75;
    --c1: #5aa9e6; --c2: #f07a76; --c3: #4cc983; --c4: #a58ae8;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { min-height: 100vh; display: flex; flex-direction: column; gap: 16px; padding-inline: 16px; padding-block: 16px; max-width: 1280px; margin-inline: auto; }
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }
.mark { width: 38px; height: 38px; border-radius: 9px; background: var(--ink); color: var(--accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; flex: none; }
.progress { display: flex; gap: 3px; flex: 1 1 180px; min-width: 120px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.done { background: var(--ink-soft); }
.progress i.now { background: var(--accent); }
.me { margin-left: auto; display: flex; align-items: baseline; gap: 10px; font-weight: 700; min-width: 0; }
.me .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12ch; }
.me .sc { font-family: var(--font-mono); font-size: 0.95rem; background: var(--ink); color: var(--accent); padding: 2px 10px; border-radius: 999px; }
.net { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 6px 12px; font-size: 0.9rem; font-weight: 600; }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px; flex: 1; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.pill { background: var(--accent); color: var(--accent-ink); padding: 2px 10px; border-radius: 999px; font-weight: 700; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 5vw, 4rem); }
h2 { font-size: clamp(1.5rem, 3.2vw, 2.4rem); }
h3 { font-size: 1.3rem; }
.lede { font-size: 1.25rem; color: var(--ink-soft); max-width: 62ch; margin: 0; }
.scene { font-size: clamp(1.1rem, 2vw, 1.5rem); max-width: 62ch; margin: 0; color: var(--ink-soft); }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt { position: relative; overflow: hidden; display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface-2); border: 2px solid transparent; border-radius: 12px; padding: 16px 18px; min-width: 0; transition: opacity .2s, border-color .2s, background .2s; }
.opt .fill { position: absolute; inset: 0 auto 0 0; width: var(--pct, 0%); background: var(--bar); opacity: .55; transition: width .5s; }
.opt > * { position: relative; }
.letter { flex: none; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; color: #fff; }
.opt:nth-child(1) .letter { background: var(--c1); }
.opt:nth-child(2) .letter { background: var(--c2); }
.opt:nth-child(3) .letter { background: var(--c3); }
.opt:nth-child(4) .letter { background: var(--c4); }
.opt .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.opt .main { font-weight: 700; font-size: 1.15rem; overflow-wrap: anywhere; }
.opt .sub { font-size: 0.95rem; color: var(--ink-soft); }
.opt .cnt { font-family: var(--font-mono); font-weight: 700; align-self: center; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); }
.opt.dim { opacity: 0.45; }
.opt.mine::after { content: "You"; position: absolute; top: 8px; right: 10px; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; background: var(--ink); color: var(--bg); padding: 1px 8px; border-radius: 999px; }
button.opt:hover:not(:disabled) { border-color: var(--ink-soft); }
button.opt:disabled { cursor: default; }
button.opt.picked { border-color: var(--ink); }

.reveal { border-left: 6px solid var(--accent); padding: 4px 0 4px 18px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.reveal .tag { font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); }
.reveal p { margin: 0; font-size: 1.15rem; }

.live { display: flex; flex-direction: column; gap: 6px; }
.live .row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 0.9rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; }
.meter { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--pct, 0%); background: var(--accent); transition: width .4s; }
.meter.bonus i { background: var(--c3); transition: none; }

.join { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.qrbox { background: #fff; padding: 16px; border-radius: 16px; border: 1px solid var(--line); width: min(100%, 380px); justify-self: center; }
.qrbox svg { display: block; width: 100%; height: auto; }
.url { font-family: var(--font-mono); font-size: 1rem; overflow-wrap: anywhere; color: var(--ink-soft); }
.names { display: flex; flex-wrap: wrap; gap: 8px; max-height: 9.5rem; overflow: hidden; }
.names span { background: var(--surface-2); border-radius: 999px; padding: 4px 14px; font-weight: 600; font-size: 1rem; max-width: 100%; overflow-wrap: anywhere; }
.count { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; }

.board { display: flex; flex-direction: column; gap: 8px; }
.board h3 { font-size: 1rem; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); font-weight: 700; }
.lb { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: 10px; padding: 8px 14px; min-width: 0; }
.lb.first { background: var(--accent); color: var(--accent-ink); }
.lb .pos { font-family: var(--font-mono); font-weight: 700; width: 2ch; }
.lb .nm { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }

.seg { display: inline-flex; gap: 4px; vertical-align: middle; }
.seg svg { width: 18px; height: 31px; display: block; }
.seg .on { fill: var(--ink); }
.seg .off { fill: var(--seg-off); }
.lb.first .seg .on { fill: var(--accent-ink); }
.lb.first .seg .off { fill: color-mix(in srgb, var(--accent-ink) 18%, transparent); }

.vals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.val { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.val b { font-family: var(--font-display); font-size: 1.1rem; }
.val span { font-size: 0.95rem; color: var(--ink-soft); }
.closer { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.2rem, 2.4vw, 1.7rem); line-height: 1.25; max-width: 40ch; margin: 0; text-wrap: balance; }

.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 10px 18px; font-weight: 700; }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: var(--line); color: var(--ink-soft); font-weight: 600; }
.btn:disabled { opacity: 0.4; cursor: default; }
.spacer { flex: 1; }
.hint { font-size: 0.85rem; color: var(--ink-soft); }

/* player */
.phone { max-width: 560px; }
.phone .stage { padding: 20px; gap: 18px; }
.phone h2 { font-size: 1.6rem; }
.phone .opts { grid-template-columns: minmax(0, 1fr); }
.phone button.opt { min-height: 68px; align-items: center; }
.phone .opt .main { font-size: 1.1rem; }
.field { display: flex; flex-direction: column; gap: 10px; }
.field label { font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
.field input { width: 100%; font-size: 1.25rem; font-weight: 600; background: var(--surface-2); border: 2px solid var(--line); border-radius: 12px; padding: 14px; }
.big { font-size: 1.2rem; padding: 14px 18px; width: 100%; }
.banner { border-radius: 12px; padding: 14px 16px; font-weight: 700; font-size: 1.15rem; display: flex; flex-direction: column; gap: 2px; }
.banner small { font-weight: 500; font-size: 0.95rem; opacity: .85; }
.banner.ok { background: var(--good-bg); color: var(--good); }
.banner.no { background: var(--bad-bg); color: var(--bad); }
.banner.wait { background: var(--surface-2); color: var(--ink); }
.rankbig { font-family: var(--font-display); font-weight: 800; font-size: 3.4rem; line-height: 1; }

@media (max-width: 820px) {
  .stage { padding: 20px; }
  .opts { grid-template-columns: minmax(0, 1fr); }
  .join, .cols { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .vals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

    if (s.type === 'lobby') {
      var names = (st.names || []).map(function (n) { return '<span>' + esc(n) + '</span>'; }).join('');
      return '<div class="eyebrow"><span class="pill">Icebreaker</span><span>Scan to join</span></div>' +
        '<div class="join"><div style="display:flex;flex-direction:column;gap:20px"><h1>What SevenX stands for, as a game</h1>' +
        '<p class="lede">Open your camera, scan the code, type your name. Questions appear on your phone. Answers lock the moment the host reveals.</p>' +
        '<div class="url">' + esc(joinUrl()) + '</div>' +
        '<div><span class="count">' + st.players + '</span> <span class="hint">' + (st.players === 1 ? 'player' : 'players') + ' in</span></div>' +
        '<div class="names">' + names + '</div></div>' +
        '<div class="qrbox">' + qrSvg(joinUrl()) + '</div></div>';
    }
    if (s.type === 'round') {
      var r = D.rounds[s.round];
      return '<div class="eyebrow"><span class="pill">Round ' + r.num + ' of 3</span></div><h1>' + esc(r.title) + '</h1><p class="lede">' + esc(r.blurb) + '</p>' +
        '<div class="reveal"><span class="tag">How to play</span><p>' + esc(r.how) + '</p></div>';
    }
    if (s.type === 'final') {
      return '<div class="eyebrow"><span class="pill">Final</span></div><h1>' + (st.top && st.top[0] && st.top[0].score > 0 ? esc(st.top[0].name) + ' wins' : 'Final scores') + '</h1>' +
        '<div class="board">' + lbRows(st.top, 8) + '</div>' + valuesRow() + '<p class="closer">' + esc(CLOSER) + '</p>';
    }
    var rn = D.rounds[s.round], rev = st.revealed, o = optsOf(s), tot = 0;
    if (rev && st.counts) st.counts.forEach(function (c) { tot += c; });
    var h = '<div class="eyebrow"><span class="pill">' + esc(rn.name) + '</span><span>Question ' + s.n + ' of ' + s.of + '</span><span>' + (s.pts ? s.pts * 100 + ' pts' : 'no points') + '</span></div>';
    if (s.scene) h += '<p class="scene">' + esc(s.scene) + '</p>';
    h += '<h2>' + esc(s.q) + '</h2><div class="opts">' + o.map(function (x, i) {
      var cls = 'opt' + (rev ? (s.call ? (i === st.correct ? ' right' : '') : (i === st.correct ? ' right' : ' dim')) : '');
      var pct = rev && tot ? Math.round(100 * st.counts[i] / tot) : 0;
      return '<div class="' + cls + '" style="--pct:' + pct + '%"><span class="fill"></span><span class="letter">' + (i + 1) + '</span><span class="txt"><span class="main">' + esc(x.m) + '</span>' + (x.s ? '<span class="sub">' + esc(x.s) + '</span>' : '') + '</span>' + (rev ? '<span class="cnt">' + st.counts[i] + ' &middot; ' + pct + '%</span>' : '') + '</div>';
    }).join('') + '</div>';
    if (!rev) {
      h += '<div class="live"><div class="row"><span>' + st.answered + ' of ' + st.players + ' answered</span><span id="clock"></span></div>' +
        '<div class="meter" style="--pct:' + (st.players ? Math.round(100 * st.answered / st.players) : 0) + '%"><i></i></div>' +
        (s.pts ? '<div class="row"><span>Speed bonus</span></div><div class="meter bonus" style="--pct:' + Math.round(bonusPct()) + '%" id="bonus"><i></i></div>' : '') + '</div>';
    } else {
      h += '<div class="reveal"><span class="tag">' + (s.call ? 'What SevenX does' : 'Answer: ' + esc(o[st.correct].m)) + '</span><p>' + esc(st.why) + '</p></div>';
      if (s.pts) h += '<div class="board"><h3>Top five</h3>' + lbRows(st.top, 5) + '</div>';
    }
    return h;
  }

  function hostView() {
    if (!hostPass || !hostChecked) return hostGate();
    if (!st) return '<main class="stage"><p class="lede">Connecting…</p></main>';
    var s = cur(), isQ = s.type === 'q', rev = isQ && st.revealed;
    var nextLabel = isQ && !rev ? 'Reveal answer' : s.type === 'lobby' ? 'Start the game' : s.type === 'final' ? 'The end' : 'Next';
    return '<div class="top"><div class="brand"><span class="mark">7&times;</span>SevenX Icebreaker</div>' + progressBar() + '</div>' +
      '<main class="stage">' + hostSlide() + '</main>' +
      '<div class="controls"><button class="btn" id="back"' + (st.slide === 0 ? ' disabled' : '') + '>Back</button>' +
      '<button class="btn ' + (isQ && !rev ? 'go' : 'primary') + '" id="next"' + (s.type === 'final' ? ' disabled' : '') + '>' + nextLabel + '</button>' +
      '<span class="hint">Space or arrow keys also work</span><span class="spacer"></span><span class="hint">' + st.players + ' players</span>' +
      '<button class="btn quiet" id="reset">' + (resetArmed ? 'Click again to wipe all players and scores' : 'Reset game') + '</button></div>';
  }

  function hostAct(fn) {
    if (busy) return; busy = true;
    fn().then(function () { return poll(); }).catch(function () { offline = true; render(true); }).then(function () { busy = false; });
  }
  function hostNext() {
    var s = cur();
    if (s.type === 'q' && !st.revealed) return hostAct(function () { return rpc('ib_host_reveal', { p_pass: hostPass }); });
    if (st.slide < SLIDES.length - 1) hostAct(function () { return rpc('ib_host_set_slide', { p_pass: hostPass, p_slide: st.slide + 1 }); });
  }
  function hostBack() {
    if (st.slide > 0) hostAct(function () { return rpc('ib_host_set_slide', { p_pass: hostPass, p_slide: st.slide - 1 }); });
  }

  /* ---------- PLAYER ---------- */
  function joinForm() {
    return '<div class="top"><div class="brand"><span class="mark">7&times;</span>SevenX Icebreaker</div></div>' +
      '<main class="stage"><h2>Join the game</h2><p class="lede" style="font-size:1.1rem">Type a name your colleagues will recognise. Questions will show up on this screen.</p>' +
      '<form id="join" class="field"><label for="name">Your name</label><input id="name" maxlength="20" autocomplete="off" value="' + esc(playerName) + '" required>' +
      (joinError ? '<div class="net">' + esc(joinError) + '</div>' : '') +
      '<button class="btn primary big" type="submit">Join</button></form></main>';
  }

  function playerView() {
    var s = cur(), me = st.me || {};
    var head = '<div class="top"><div class="brand"><span class="mark">7&times;</span></div><div class="me"><span class="nm">' + esc(me.name) + '</span><span class="sc">' + (me.score || 0) + ' pts</span></div></div>';
    var body = '';
    if (s.type === 'lobby') {
      body = '<h2>You are in, ' + esc(me.name) + '</h2><p class="lede" style="font-size:1.1rem">Watch the big screen. The first question appears here when the host starts.</p>' +
        '<div class="banner wait">' + st.players + ' ' + (st.players === 1 ? 'player' : 'players') + ' joined<small>Keep this page open.</small></div>';
    } else if (s.type === 'round') {
      var r = D.rounds[s.round];
      body = '<div class="eyebrow"><span class="pill">Round ' + r.num + ' of 3</span></div><h2>' + esc(r.title) + '</h2><p class="lede" style="font-size:1.1rem">' + esc(r.blurb) + '</p>' +
        '<div class="reveal"><span class="tag">How to play</span><p>' + esc(r.how) + '</p></div>';
    } else if (s.type === 'final') {
      body = '<div class="eyebrow"><span class="pill">Final</span></div><h2>That is the game</h2>' +
        '<div><div class="rankbig">#' + (me.rank || '-') + '</div><p class="hint">of ' + (me.of || st.players) + ' players &middot; ' + (me.score || 0) + ' points</p></div>' +
        '<div class="board"><h3>Top three</h3>' + lbRows(st.top, 3) + '</div><p class="closer" style="font-size:1.1rem">' + esc(CLOSER) + '</p>';
    } else {
      var rev = st.revealed, mine = rev ? me.choice : (me.choice != null ? me.choice : localPick[st.slide]);
      var locked = mine != null || rev, o = optsOf(s), tot = 0, rn = D.rounds[s.round];
      if (rev && st.counts) st.counts.forEach(function (c) { tot += c; });
      body = '<div class="eyebrow"><span class="pill">' + esc(rn.name) + '</span><span>' + s.n + ' of ' + s.of + '</span></div>' +
        (s.scene ? '<p class="scene">' + esc(s.scene) + '</p>' : '') + '<h2>' + esc(s.q) + '</h2><div class="opts">' + o.map(function (x, i) {
        var cls = 'opt';
        if (rev) cls += s.call ? (i === st.correct ? ' right' : '') : (i === st.correct ? ' right' : (i === mine ? ' wrong' : ' dim'));
        else if (i === mine) cls += ' picked';
        if (rev && i === mine) cls += ' mine';
        var pct = rev && tot ? Math.round(100 * st.counts[i] / tot) : 0;
        var inner = '<span class="fill"></span><span class="letter">' + (i + 1) + '</span><span class="txt"><span class="main">' + esc(x.m) + '</span>' + (x.s ? '<span class="sub">' + esc(x.s) + '</span>' : '') + '</span>' + (rev && s.call ? '<span class="cnt">' + pct + '%</span>' : '');
        return '<button class="' + cls + '" data-pick="' + i + '" style="--pct:' + (s.call ? pct : 0) + '%"' + (locked ? ' disabled' : '') + '>' + inner + '</button>';
      }).join('') + '</div>';
      if (!rev) {
        body += mine != null ? '<div class="banner wait">Locked in<small>Waiting for the host to reveal. Your answer cannot change.</small></div>'
          : '<div class="live"><div class="row"><span>Faster answers score more</span></div><div class="meter bonus" style="--pct:' + Math.round(bonusPct()) + '%" id="bonus"><i></i></div></div>';
      } else {
        if (s.call) body += '<div class="banner wait">' + (mine == null ? 'You did not vote' : 'You voted ' + esc(o[mine].m)) + '<small>No points this round. Defend your choice to your neighbour.</small></div>';
        else if (mine == null) body += '<div class="banner no">No answer<small>The answer was ' + esc(o[st.correct].m) + '.</small></div>';
        else if (mine === st.correct) body += '<div class="banner ok">Correct, +' + (me.pts || 0) + ' points<small>Rank #' + me.rank + ' of ' + me.of + '</small></div>';
        else body += '<div class="banner no">Not this time<small>Rank #' + me.rank + ' of ' + me.of + '</small></div>';
        body += '<div class="reveal"><span class="tag">' + (s.call ? 'What SevenX does' : 'Why') + '</span><p style="font-size:1.05rem">' + esc(st.why) + '</p></div>';
      }
    }
    return head + '<main class="stage">' + body + '</main>';
  }

  /* ---------- render / poll ---------- */
  function view() {
    if (HOST) return hostView();
    if (!playerId) return joinForm();
    if (!st) return '<main class="stage"><p class="lede">Connecting…</p></main>';
    return playerView();
  }
  function render(force) {
    var app = document.getElementById('app');
    var active = document.activeElement && document.activeElement.id;
    var typed = null;
    if (active === 'name' || active === 'pass') typed = document.activeElement.value;
    app.className = 'app' + (HOST ? '' : ' phone');
    app.innerHTML = (offline ? '<div class="net">Reconnecting…</div>' : '') + view();
    var el = active && document.getElementById(active);
    if (el) { el.focus(); if (typed !== null) el.value = typed; }
    tick();
  }
  function tick() {
    var b = document.getElementById('bonus');
    if (b) b.style.setProperty('--pct', Math.round(bonusPct()) + '%');
    var c = document.getElementById('clock');
    if (c) c.textContent = Math.floor(elapsed()) + 's';
  }
  setInterval(tick, 250);

  function poll() {
    if (!HOST && !playerId) return Promise.resolve();
    return rpc('ib_state', { p_player: HOST ? null : playerId }).then(function (s) {
      var wasOffline = offline;
      offline = false;
      skew = new Date(s.now).getTime() - Date.now();
      if (!HOST && playerId && !s.me) {
        playerId = null; lsSet('sx-player', null); st = null; joinError = 'The game was reset. Join again.'; sig = ''; render(true); return;
      }
      var key = JSON.stringify(Object.assign({}, s, { now: 0 }));
      var changed = key !== sig;
      st = s; sig = key;
      if (changed || wasOffline) render();
    }).catch(function () {
      if (!offline) { offline = true; render(); }
    });
  }
  setInterval(poll, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  window.addEventListener('hashchange', function () { location.reload(); });

  /* ---------- events ---------- */
  document.getElementById('app').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'next') hostNext();
    else if (b.id === 'back') hostBack();
    else if (b.id === 'reset') {
      if (resetArmed) { resetArmed = false; hostAct(function () { return rpc('ib_host_reset', { p_pass: hostPass }); }); }
      else { resetArmed = true; render(); }
    } else if (b.dataset.pick !== undefined && !HOST) {
      var slide = st.slide, choice = +b.dataset.pick;
      if (localPick[slide] != null) return;
      localPick[slide] = choice; render();
      rpc('ib_answer', { p_player: playerId, p_slide: slide, p_choice: choice }).then(function (r) {
        if (r === 'closed') { delete localPick[slide]; }
        poll();
      }).catch(function () { poll(); });
    }
  });
  document.getElementById('app').addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'join') {
      var name = document.getElementById('name').value.trim();
      if (!name) return;
      playerName = name; lsSet('sx-name', name);
      rpc('ib_join', { p_name: name }).then(function (id) {
        playerId = id; lsSet('sx-player', id); joinError = ''; sig = ''; poll();
      }).catch(function () { joinError = 'Could not join. Check your connection and try again.'; render(); });
    } else if (e.target.id === 'gate') {
      var p = document.getElementById('pass').value.trim();
      rpc('ib_host_ok', { p_pass: p }).then(function (ok) {
        if (ok) { hostPass = p; lsSet('sx-hostpass', p); hostChecked = true; authError = ''; sig = ''; poll(); render(); }
        else { authError = 'That passcode is not right.'; render(); }
      }).catch(function () { authError = 'Could not reach the server.'; render(); });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!HOST || !st) return;
    var t = e.target.tagName;
    if (t === 'INPUT' || t === 'BUTTON') return;
    if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); hostNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); hostBack(); }
  });

  if (HOST && hostPass) {
    rpc('ib_host_ok', { p_pass: hostPass }).then(function (ok) { hostChecked = !!ok; if (!ok) hostPass = ''; render(); poll(); }).catch(function () { render(); });
  }
  render();
  poll();
})();
</script>
</body>
</html>
